<!doctype html>
<html>
    <head>
        <meta charset="UTF-8" />
        <link rel="stylesheet" href="style.css" />
        <title>Paradox Kaizo</title>
    </head>
    <body>
        <div class="container">
            <div class="page-title">Paradox Kaizo</div>
            <div class="paradex-display">
                <div class="paradex-scroll">
                    <img src="pokedex-view.png"></img>
                    <img src="pokedex-view.png"></img>
                </div>
            </div>

            <input type="radio" id="overview-tab" name="tabs" checked>
            <input type="radio" id="item-map-tab" name="tabs">

            <div class="tab-nav">
              <label class="tab-label" for="overview-tab">Overview</label>
              <label class="tab-label" for="item-map-tab">Item Map</label>
            </div>

            <iframe id="overview-frame" class="tab-frame" src="guide.html" onload="this.style.height = this.contentWindow.document.body.scrollHeight + px;"></iframe>
            <iframe id="item-map-frame" class="tab-frame" src="items.html" onload="this.style.height = this.contentWindow.document.body.scrollHeight + 'px';"></iframe>
        </div>
    </body>
</html>
